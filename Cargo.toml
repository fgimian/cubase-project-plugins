[package]
name = "cubase-project-plugins"
version = "0.1.3"
categories = ["command-line-interface"]
edition = "2024"
keywords = ["music-production", "cubase"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/fgimian/cubase-project-plugins"
description = "Displays plugins used in your Cubase projects along with the Cubase version the project was created with."

[lints.clippy]
correctness = { level = "warn", priority = 1 }
pedantic = { level = "warn", priority = 1 }
nursery = { level = "warn", priority = 1 }
cargo = { level = "warn", priority = 1 }
expect_used = "warn"
unwrap_used = "warn"
get_unwrap = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
unreachable = "warn"
dbg_macro = "warn"
multiple_crate_versions = { level = "allow", priority = 2 }

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
colored = "3.1.1"
dirs = "6.0.0"
glob = "0.3.4"
natord = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
wildmatch = "2.6.1"

[dev-dependencies]
rstest = "0.26.1"
similar-asserts = "2.0.0"
